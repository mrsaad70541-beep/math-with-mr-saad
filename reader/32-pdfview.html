<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' blob: https:; worker-src 'self' blob:;">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قارئ الكتاب — نموذج محلي</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root { --navy:#102B49; --gold:#E8A33D; --ink:#1c2b3a; --mut:#5b6b7c; --line:#e3e8ee; }
* { box-sizing: border-box; }
body { margin:0; font-family:'Alexandria',Tahoma,sans-serif; background:#f4f6f9; color:var(--ink); }
#bar { position:sticky; top:0; z-index:5; background:var(--navy); color:#fff; padding:8px 10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
#bar button, #bar select, #bar input { font:inherit; font-size:13px; border:0; border-radius:8px; padding:6px 10px; }
#bar button { background:#ffffff22; color:#fff; cursor:pointer; }
#bar button.on { background:var(--gold); color:var(--navy); font-weight:700; }
#bar input[type=number] { width:64px; text-align:center; }
#pgTotal { direction:ltr; unicode-bidi:isolate; display:inline-block; }
#bar input[type=search] { width:150px; }
#bar select { max-width:60vw; }
#bar .sep { flex:1 1 100%; height:0; }
#prog { height:4px; background:#ffffff33; flex:1 1 100%; border-radius:2px; overflow:hidden; }
#prog i { display:block; height:100%; background:var(--gold); width:0; transition:width .3s; }
#stage { display:flex; justify-content:center; padding:14px 8px 80px; min-height:70vh; }
canvas { background:#fff; box-shadow:0 2px 14px #0002; max-width:none; }
#side { position:fixed; inset-inline-start:0; top:0; bottom:0; width:min(320px,90vw); background:#fff; box-shadow:0 0 18px #0003; padding:14px; overflow:auto; transform:translateX(105%); transition:transform .25s; z-index:9; }
#side.open { transform:none; }
#side h3 { margin:4px 0 10px; font-size:15px; color:var(--navy); }
#side .item { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; font-size:13px; cursor:pointer; }
#side .item small { color:var(--mut); display:block; }
#side textarea { width:100%; min-height:110px; font:inherit; font-size:13px; border:1px solid var(--line); border-radius:10px; padding:8px; }
#side .dim { color:var(--mut); font-size:12px; }
#noteInd { font-size:11px; color:var(--gold); }
body.unavail #bar button, body.unavail #bar input, body.unavail #q, body.unavail #cv { display:none; }
#unavail { margin:14px auto; padding:16px; max-width:520px; background:#fff8e6; border:1px solid #e6cf8f; border-radius:10px; font-size:14px; }
#unavail .pickVer { display:block; width:100%; margin-top:8px; text-align:start; }
#loadErr { margin:14px auto; padding:12px 16px; background:#fff4f4; border:1px solid #e5b4b4; color:#7a1f1f; border-radius:10px; font-size:14px; }
#loadErr button { margin-inline-start:10px; font:inherit; padding:4px 12px; border:0; border-radius:8px; background:var(--navy); color:#fff; cursor:pointer; }
#storeWarn { position:fixed; bottom:10px; inset-inline-start:10px; z-index:10; background:#7a1f1f; color:#fff; font-size:12px; padding:6px 10px; border-radius:8px; }
.sideHead { display:flex; justify-content:flex-start; }
.sideClose { font:inherit; border:0; background:#eee; border-radius:8px; width:30px; height:30px; cursor:pointer; }
.sideBtn { font:inherit; padding:6px 14px; border:0; border-radius:8px; background:var(--navy); color:#fff; cursor:pointer; }
.sideBtn.alt { background:#eee; color:var(--ink); }
</style>
</head>
<body>
<div id="bar">
  <select id="bookSel" title="الكتاب والإصدار"></select>
  <button id="prev">‹ السابق</button>
  <input type="number" id="pg" min="1" value="1">
  <span id="pgTotal" style="font-size:12px">/ …</span>
  <button id="next">التالي ›</button>
  <button id="zout">−</button><span id="zlvl" style="font-size:12px;min-width:44px;text-align:center">100%</span><button id="zin">+</button>
  <button id="fit">ملاءمة العرض</button>
  <button id="bm" title="إشارة مرجعية">☆</button>
  <button id="notes">ملاحظات</button>
  <button id="idx">الفهرس</button>
  <button id="share">مشاركة الصفحة</button>
  <div id="prog"><i></i></div>
  <input type="search" id="q" placeholder="بحث في الكتاب…">
</div>
<div id="storeWarn" hidden>تعذر الحفظ المحلي — لن تُحفظ التفضيلات على هذا الجهاز.</div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="side"></div>
<script type="module" src="pdfview.js"></script>
</body>
</html>
